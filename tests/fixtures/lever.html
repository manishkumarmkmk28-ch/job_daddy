<!doctype html><html><body><form class="application-form">
<ul>
<li class="application-question"><label><div class="application-label">Resume/CV <span>✱</span></div><input type="file" name="resume"></label></li>
<li class="application-question"><label><div class="application-label">Full name *</div><input type="text" name="name" required></label></li>
<li class="application-question"><label><div class="application-label">Email *</div><input type="email" name="email" required></label></li>
<li class="application-question"><label><div class="application-label">Phone</div><input type="text" name="phone"></label></li>
<li class="application-question"><label><div class="application-label">Current company</div><input type="text" name="org"></label></li>
<li class="application-question"><label><div class="application-label">LinkedIn URL</div><input type="text" name="urls[LinkedIn]"></label></li>
<li class="application-question"><label><div class="application-label">GitHub URL</div><input type="text" name="urls[GitHub]"></label></li>
<li class="application-question"><label><div class="application-label">Portfolio URL</div><input type="text" name="urls[Portfolio]"></label></li>
<li class="application-question"><fieldset><legend>Are you legally authorized to work in India without sponsorship?</legend>
  <label><input type="radio" name="cards[abc][field0]" value="Yes">Yes</label>
  <label><input type="radio" name="cards[abc][field0]" value="No">No</label></fieldset></li>
<li class="application-question"><label><div class="application-label">What is your notice period?</div><input type="text" name="cards[abc][field1]"></label></li>
<li class="application-question"><label><div class="application-label">Tell us about a project you are proud of.</div><textarea name="cards[abc][field2]"></textarea></label></li>
</ul><button type="submit" class="template-btn-submit">Submit application</button></form></body></html>
