<!doctype html><html><body><form id="application_form">
<div class="field"><label for="first_name">First Name *</label><input id="first_name" name="job_application[first_name]" type="text" required></div>
<div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="job_application[last_name]" type="text" required></div>
<div class="field"><label for="email">Email *</label><input id="email" name="job_application[email]" type="text" required></div>
<div class="field"><label for="phone">Phone</label><input id="phone" name="job_application[phone]" type="text"></div>
<div class="field"><label for="resume">Resume/CV *</label><input id="resume" name="job_application[resume]" type="file"></div>
<div class="field"><label for="q_linkedin">LinkedIn Profile</label><input id="q_linkedin" name="job_application[answers][1]" type="text"></div>
<div class="field"><label for="q_sponsor">Will you now or in the future require visa sponsorship?</label>
  <select id="q_sponsor" name="job_application[answers][2]"><option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select></div>
<div class="field"><label for="gender">Gender</label>
  <select id="gender" name="job_application[gender]"><option value="">Select</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
<div class="field"><label for="q_why">Why do you want to work here? *</label><textarea id="q_why" name="job_application[answers][3]" maxlength="400"></textarea></div>
<div class="field"><label for="q_conflict">Describe a time you managed conflict.</label><textarea id="q_conflict" name="job_application[answers][4]"></textarea></div>
<button type="submit" id="submit_app">Submit Application</button>
</form></body></html>
